services:
  matrix-serverchat:
    build: .
    container_name: matrix-serverchat
    restart: unless-stopped
    environment:
      MATRIX_URL: "${MATRIX_URL:?Set MATRIX_URL in backend/.env}"
      MATRIX_ID: "${MATRIX_ID:?Set MATRIX_ID in backend/.env}"
      MATRIX_PASSWORD_FILE: "/run/secrets/matrix_password"
      ROOM_ID: "${ROOM_ID:?Set ROOM_ID in backend/.env}"
      WS_HOST: "0.0.0.0"
      WS_PORT: "8766"
      DATABASE_PATH: "/data/bridge.db"
      MAX_MATRIX_MESSAGE_LENGTH: "256"
      BIND_TOKEN_TTL_SECONDS: "600"
      # 管理员可按秒调整；默认每位未绑定用户最多每 5 分钟提醒一次。
      UNBOUND_REMINDER_COOLDOWN_SECONDS: "300"
      # scoped：按服务器绑定，适合离线服；online_uuid：正版 UUID 全服通用。
      BINDING_MODE: "scoped"
      MATRIX_RELAY_GROUP: "main"
      # 管理员必须同时登记在本地管理员表中，并达到此房间权限等级。
      ADMIN_POWER_LEVEL: "50"
      # 玩家头像：本地缓存并在每周日北京时间 00:00 刷新。
      AVATAR_ENABLED: "true"
      # text：全客户端干净显示；emote：支持 Matrix 自定义表情的客户端显示头像
      AVATAR_DISPLAY_MODE: "text"
      AVATAR_DIRECTORY: "/data/avatars"
      AVATAR_LOOKUP_TIMEOUT_SECONDS: "8"
      # 自动重连保护：两次 60-180 秒的短会话出现在 10 分钟窗口内即屏蔽上下线动态。
      RECONNECT_GUARD_ENABLED: "true"
      RECONNECT_GUARD_WINDOW_SECONDS: "600"
      RECONNECT_GUARD_MIN_SESSION_SECONDS: "60"
      RECONNECT_GUARD_MAX_SESSION_SECONDS: "180"
      RECONNECT_GUARD_THRESHOLD: "2"
      # 快速抖动：60 秒内出现 3 次不超过 30 秒的会话即触发。
      RECONNECT_GUARD_RAPID_WINDOW_SECONDS: "60"
      RECONNECT_GUARD_RAPID_MAX_SESSION_SECONDS: "30"
      RECONNECT_GUARD_RAPID_THRESHOLD: "3"
      # 屏蔽后连续 15 分钟没有新上下线事件则自动解除。
      RECONNECT_GUARD_QUIET_SECONDS: "900"
      # 插件连接持续异常 30 秒才通知；同一服务器的状态消息至少间隔 60 秒。
      SERVER_HEALTH_ENABLED: "true"
      SERVER_HEALTH_GRACE_SECONDS: "30"
      SERVER_HEALTH_MIN_NOTICE_INTERVAL_SECONDS: "60"
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - ./data:/data
    secrets:
      - source: matrix_password
        target: matrix_password
        uid: "10001"
        gid: "10001"
        mode: 0400

secrets:
  matrix_password:
    file: ./secrets/matrix_password
